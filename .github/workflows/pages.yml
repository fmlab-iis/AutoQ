# Deploys the site in site/ to GitHub Pages: the landing page plus the
# playground, which runs AutoQ compiled to WebAssembly (wasm/build.sh).
#
# One-time setup before the first run: in the repository settings, open
# Settings -> Pages -> Build and deployment and set Source to "GitHub Actions".
# Without that, the Configure Pages step fails. (Passing `enablement: true` to
# actions/configure-pages would enable Pages automatically, but it needs a
# token with admin rights; the default GITHUB_TOKEN does not have them.)
#
# After the first deploy, compare the page_url printed by the deploy step with
# the canonical and og: URLs in site/index.html (https://fmlab-iis.github.io/AutoQ/).
#
# The first run builds Z3 and the ANTLR runtime for WebAssembly, which takes
# a while; later runs restore them from the cache.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wasm/**"
      - "src/**"
      - "include/**"
      - "cli/**"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  EMSDK_VERSION: "6.0.12"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # autoq -v reports the commit from git describe

      - name: Install Boost headers
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Cache Z3 and ANTLR for WebAssembly
        uses: actions/cache@v4
        with:
          path: build-wasm/deps
          key: wasm-deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('wasm/build.sh') }}

      - name: Build the playground (AutoQ to WebAssembly)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/build.sh site/playground

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
