name: Grover span scaling (300 seconds per case)
on:
  push:
    branches: [feature/lsta-span-inclusion-tuples]
    paths:
      - 'unit_tests/grover_span_cases.cc'
      - 'unit_tests/grover_span_util.hh'
      - '.github/workflows/grover-span-benchmark.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release (outside case timing)
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-filesystem-dev libboost-test-dev libantlr4-runtime-dev
          make release
      - name: Sweep probability-one consecutive qubit counts with 300 seconds per case
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}:${{ github.workspace }}/build/unit_tests
        run: |
          python3 -u - <<'PY'
          import csv, os, platform, resource, subprocess, time
          from pathlib import Path
          out=Path('grover-results'); out.mkdir(exist_ok=True)
          cpu=Path('/proc/cpuinfo').read_text()
          (out/'environment.txt').write_text(platform.platform()+'\n'+cpu+'\ncommit='+os.environ.get('GITHUB_SHA','')+'\nRelease; probability-one only (M=N/4, R=1); timeout=300s per (scenario,qubits) process, including fixture construction and positive/negative controls; no shared experiment deadline or custom job timeout (GitHub platform limits still apply); child address-space limit=4GiB; depths=2,3,...,65536 (fixture implementation cap); no AutoQ depth/search-step cap\n')
          def memory_limit():
              resource.setrlimit(resource.RLIMIT_AS,(4*1024**3,4*1024**3))
          scenarios=['grover_paper_probability_one']
          with (out/'results.csv').open('w',newline='') as f:
              writer=csv.writer(f)
              writer.writerow(['scenario','qubits','status','seconds','returncode'])
              for case in scenarios:
                  n=2; largest=None; stop='fixture_qubit_cap'
                  while n<=65536:
                      env=os.environ.copy(); env['AUTOQ_GROVER_QUBITS']=str(n)
                      began=time.monotonic(); code=''; status=''
                      try:
                          p=subprocess.run(['./build/unit_tests/span_inclusion_test','--run_test='+case,'--report_level=short','--log_level=message'],env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=300,preexec_fn=memory_limit)
                          text=p.stdout; code=p.returncode
                          status='passed' if code==0 else 'failed'
                      except subprocess.TimeoutExpired as e:
                          text=e.stdout or b''
                          if isinstance(text,bytes): text=text.decode(errors='replace')
                          status='timeout'
                      elapsed=time.monotonic()-began
                      (out/(case+'-'+str(n)+'.log')).write_text(text)
                      writer.writerow([case,n,status,elapsed,code]); f.flush()
                      print(case,n,status,elapsed,flush=True)
                      if status!='passed':
                          stop=status
                          break
                      largest=n; n+=1
                  with (out/'summary.txt').open('a') as summary:
                      summary.write(case+': largest consecutively completed tested depth='+str(largest)+'; first unfinished depth='+str(n)+'; stop='+stop+'; timeout=300s per case; a failure is not a timeout or proof of non-inclusion; no claim about untested larger depths; scenario includes positive and negative controls; success-probability-one scenario enumerates M=2^(n-2) basis generators\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grover-span-results
          path: grover-results/
